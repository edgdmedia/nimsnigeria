            - region "Do I need to pay to attend? Participation is free, but registration is required. Priority will be given to pre-accredited delegates." [ref=f19e142]:
              - paragraph [ref=f19e144]: Participation is free, but registration is required. Priority will be given to pre-accredited delegates.
