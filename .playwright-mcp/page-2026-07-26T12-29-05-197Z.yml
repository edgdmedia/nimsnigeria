          - group [ref=f19e237]:
            - heading "Will media and press be present?" [level=6] [ref=f19e240]
            - region "Will media and press be present? Yes. Accredited media outlets will be covering the event. Press passes are available by request via info@nimsnigeria.org." [ref=f19e248]:
              - paragraph [ref=f19e250]: Yes. Accredited media outlets will be covering the event.Press passes are available by request via info@nimsnigeria.org.
          - group [ref=f19e251]:
            - heading "What are the security arrangements?" [level=6] [ref=f19e254]
            - region "What are the security arrangements? The summit is managed under strict security protocols in collaboration with federal agencies. Delegates must wear visible ID badges at all times. Bags and vehicles may be screened on arrival." [ref=f19e262]:
