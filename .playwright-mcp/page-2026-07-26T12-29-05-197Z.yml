            - region "Can international delegates attend NIMS 2025? Yes. International participants are welcome and encouraged. Please register early to secure your accreditation and ensure all travel documents (visa, yellow card, etc.) are arranged in advance. You may email info@nimsnigeria.org if you require a formal invitation letter." [ref=f19e170]:
