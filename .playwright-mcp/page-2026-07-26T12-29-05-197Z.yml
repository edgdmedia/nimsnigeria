            - heading "Can I attend the summit virtually?" [level=6] [ref=f19e120]
            - region "Can I attend the summit virtually? Yes. Key sessions will be livestreamed for registered virtual attendees. You’ll receive a viewing link and schedule closer to the event." [ref=f19e128]:
              - paragraph [ref=f19e130]: Yes. Key sessions will be livestreamed for registered virtual attendees.You’ll receive a viewing link and schedule closer to the event.
