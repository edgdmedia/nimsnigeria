      - generic [ref=e50]:
        - heading "A Presidential Initiative for Industrial Growth" [level=4] [ref=e52]
        - generic [ref=e53]:
          - paragraph [ref=e54]:
            - generic [ref=e55]: "N"
            - text: IMS 2025 is a strategic, high-level event established under the Office of the Senior Special Assistant to the President on Industrial Training & Development.
          - paragraph [ref=e57]: The summit responds directly to the national need for a stronger, more competitive industrial workforce. It is backed by Nigeria’s top leadership and aligns with the country’s long-term economic transformation goals.
          - paragraph [ref=e58]: The summit convenes government, business, academia, and global partners to accelerate change in how Nigeria builds, trains, and deploys industrial talent.
      - generic [ref=e61]:
        - generic [ref=e62]:
          - heading "Our Mission" [level=4] [ref=e64]
          - heading "To bridge the gap between potential and productivity by reshaping how Nigeria develops, supports, and sustains its industrial manpower." [level=4] [ref=e69]
        - generic [ref=e71]:
          - paragraph [ref=e72]: "The summit’s mission is to:"
          - list [ref=e73]:
            - listitem [ref=e74]: Identify and address sector-specific skill gaps
            - listitem [ref=e75]: Design new frameworks for apprenticeship and vocational training
            - listitem [ref=e76]: Build stronger ties between education, government, and industry
            - listitem [ref=e77]: Set policy direction for a long-term workforce strategy
            - listitem [ref=e78]: Position Nigeria as a regional leader in industrial skills development
      - generic [ref=e84]:
        - heading "Why This Summit Now?" [level=4] [ref=e86]
        - generic [ref=e87]:
          - paragraph [ref=e88]:
            - generic [ref=e89]: "N"
            - text: igeria stands at a critical juncture in its economic development journey. Despite being Africa’s largest economy and most populous nation, our manufacturing capacity and industrial growth remain limited.
          - paragraph [ref=e91]:
            - strong [ref=e92]: Why?
            - text: Because of a persistent manpower challenge. The workforce isn’t keeping pace with industry’s needs. There’s a widening gap between the skills our people have and the skills our industries demand.
          - paragraph [ref=e93]: This gap holds back productivity, job creation, global competitiveness, and inclusive economic progress.
          - paragraph [ref=e94]: NIMS 2025 is a bold, strategic response. It will set a new direction for Nigeria’s industrial workforce, grounded in data, driven by collaboration, and backed by presidential leadership.
