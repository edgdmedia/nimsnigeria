      - generic [ref=f3e50]:
        - heading "A Presidential Initiative for Industrial Growth" [level=4] [ref=f3e52]
        - generic [ref=f3e53]:
          - paragraph [ref=f3e54]:
            - generic [ref=f3e55]: "N"
            - text: IMS 2025 is a strategic, high-level event established under the Office of the Senior Special Assistant to the President on Industrial Training & Development.
          - paragraph [ref=f3e57]: The summit responds directly to the national need for a stronger, more competitive industrial workforce. It is backed by Nigeria’s top leadership and aligns with the country’s long-term economic transformation goals.
          - paragraph [ref=f3e58]: The summit convenes government, business, academia, and global partners to accelerate change in how Nigeria builds, trains, and deploys industrial talent.
      - generic [ref=f3e61]:
        - generic [ref=f3e62]:
          - heading "Our Mission" [level=4] [ref=f3e64]
          - heading "To bridge the gap between potential and productivity by reshaping how Nigeria develops, supports, and sustains its industrial manpower." [level=4] [ref=f3e69]
        - generic [ref=f3e71]:
          - paragraph [ref=f3e72]: "The summit’s mission is to:"
          - list [ref=f3e73]:
            - listitem [ref=f3e74]: Identify and address sector-specific skill gaps
            - listitem [ref=f3e75]: Design new frameworks for apprenticeship and vocational training
            - listitem [ref=f3e76]: Build stronger ties between education, government, and industry
            - listitem [ref=f3e77]: Set policy direction for a long-term workforce strategy
            - listitem [ref=f3e78]: Position Nigeria as a regional leader in industrial skills development
      - generic [ref=f3e85]:
        - paragraph [ref=f3e86]:
          - generic [ref=f3e87]: "N"
          - text: igeria stands at a critical juncture in its economic development journey. Despite being Africa’s largest economy and most populous nation, our manufacturing capacity and industrial growth remain limited.
        - paragraph [ref=f3e89]:
          - strong [ref=f3e90]: Why?
          - text: Because of a persistent manpower challenge. The workforce isn’t keeping pace with industry’s needs. There’s a widening gap between the skills our people have and the skills our industries demand.
        - paragraph [ref=f3e91]: This gap holds back productivity, job creation, global competitiveness, and inclusive economic progress.
        - paragraph [ref=f3e92]: NIMS 2025 is a bold, strategic response. It will set a new direction for Nigeria’s industrial workforce, grounded in data, driven by collaboration, and backed by presidential leadership.
