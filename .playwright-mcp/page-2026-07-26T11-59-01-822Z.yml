      - generic [ref=f1e48]:
        - paragraph [ref=f1e49]:
          - generic [ref=f1e50]: "N"
          - text: IMS 2025 features a curated Exhibition Hub showcasing innovations, tools, and solutions driving industrial development in Nigeria and beyond.
        - paragraph [ref=f1e52]: Our current exhibitors represent leading voices in workforce development, vocational training, automation, and manufacturing. Their displays will provide delegates with an opportunity to interact directly with solutions that are shaping the future of skills and productivity.
      - generic [ref=f1e54]:
        - generic [ref=f1e58]:
          - heading "Interested in Exhibiting at NIMS 2025?" [level=4] [ref=f1e60]
          - generic [ref=f1e61]:
            - paragraph [ref=f1e62]: We’re inviting forward-thinking companies, training institutions, and solution providers to exhibit at NIMS 2025. This is a unique chance to connect directly with federal ministries, industry leaders, TVET institutions, investors, development partners, and global media.
            - paragraph [ref=f1e63]: We’re especially keen to showcase innovators in industrial equipment, vocational training, workforce tracking, apprenticeship platforms, and ESG solutions.
            - paragraph [ref=f1e64]: As an exhibitor, you’ll gain prime visibility in the Dome Pavilion, face-to-face access to presidential and ministerial delegations, curated networking, and live media exposure to over 1,000 high-impact attendees.
        - generic [ref=f1e65]:
          - heading [level=5] [ref=f1e67]:
            - text: Reach out to us before 15th July 2025 at
            - link "info@nimsnigeria.org" [ref=f1e68]:
              - /url: info@nimsnigeria.org
            - text: to learn more about sponsorship opportunities.
          - paragraph [ref=f1e70]:
