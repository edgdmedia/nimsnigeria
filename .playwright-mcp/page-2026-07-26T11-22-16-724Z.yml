      - generic [ref=f9e51]:
        - paragraph [ref=f9e52]: NIMS 2025 is a strategic, high-level event established under the Office of the Senior Special Assistant to the President on Industrial Training & Development.
        - paragraph [ref=f9e53]: The summit responds directly to the national need for a stronger, more competitive industrial workforce. It is backed by Nigeria’s top leadership and aligns with the country’s long-term economic transformation goals.
        - paragraph [ref=f9e54]: The summit convenes government, business, academia, and global partners to accelerate change in how Nigeria builds, trains, and deploys industrial talent.
      - generic [ref=f9e61]:
        - paragraph [ref=f9e62]: Nigeria stands at a critical juncture in its economic development journey. Despite being Africa’s largest economy and most populous nation, our manufacturing capacity and industrial growth remain limited.
        - paragraph [ref=f9e63]:
          - strong [ref=f9e64]: Why?
          - text: Because of a persistent manpower challenge. The workforce isn’t keeping pace with industry’s needs. There’s a widening gap between the skills our people have and the skills our industries demand.
        - paragraph [ref=f9e65]: This gap holds back productivity, job creation, global competitiveness, and inclusive economic progress.
        - paragraph [ref=f9e66]: NIMS 2025 is a bold, strategic response. It will set a new direction for Nigeria’s industrial workforce, grounded in data, driven by collaboration, and backed by presidential leadership.
